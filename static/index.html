<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESB-GPT — API Discovery</title>
  <style>
    :root {
      --bg: #0f0f12;
      --surface: #1a1a1f;
      --border: #2d2d35;
      --text: #e4e4e7;
      --muted: #71717a;
      --accent: #a78bfa;
      --accent-dim: #7c3aed;
      --direct: #22c55e;
      --closest: #eab308;
      --no-match: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      line-height: 1.5;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 2rem 1rem; }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    .search-row {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .search-row input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 1rem;
    }
    .search-row input::placeholder { color: var(--muted); }
    .search-row input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(167, 139, 250, 0.2);
    }
    .search-row button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
    }
    .search-row button:hover { background: var(--accent-dim); }
    .search-row button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--no-match);
      color: #fca5a5;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    .results { display: flex; flex-direction: column; gap: 1rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .card-title { font-weight: 600; font-size: 1.05rem; }
    .badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .badge.direct { background: rgba(34, 197, 94, 0.2); color: var(--direct); }
    .badge.closest { background: rgba(234, 179, 8, 0.2); color: var(--closest); }
    .badge.no_match { background: rgba(239, 68, 68, 0.2); color: var(--no-match); }
    .score { color: var(--muted); font-size: 0.85rem; }
    .card p { margin: 0.5rem 0; font-size: 0.9rem; color: var(--muted); }
    .card .description { color: var(--text); }
    .io { font-size: 0.8rem; color: var(--muted); margin-top: 0.5rem; }
    .io strong { color: var(--text); }
    .enhancement {
      margin-top: 0.75rem;
      padding: 0.75rem;
      background: rgba(167, 139, 250, 0.1);
      border-left: 3px solid var(--accent);
      border-radius: 4px;
      font-size: 0.9rem;
      white-space: pre-wrap;
    }
    .links { margin-top: 1.5rem; font-size: 0.85rem; }
    .links a { color: var(--accent); text-decoration: none; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>ESB-GPT</h1>
    <p class="subtitle">Describe the API you need in plain language.</p>

    <div class="search-row">
      <input
        type="text"
        id="query"
        placeholder="e.g. get all orders for a customer"
        autocomplete="off"
      />
      <button type="button" id="searchBtn">Search</button>
    </div>

    <div id="error" class="error" style="display: none;"></div>
    <div id="results" class="results"></div>

    <div class="links">
      <a href="/docs">OpenAPI /docs</a> · <a href="/health">Health</a>
    </div>
  </div>

  <script>
    const queryEl = document.getElementById('query');
    const searchBtn = document.getElementById('searchBtn');
    const errorEl = document.getElementById('error');
    const resultsEl = document.getElementById('results');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
      resultsEl.innerHTML = '';
    }
    function clearError() {
      errorEl.style.display = 'none';
    }

    function matchClass(matchType) {
      if (matchType === 'direct') return 'direct';
      if (matchType === 'closest') return 'closest';
      return 'no_match';
    }

    function renderResult(r) {
      const inputs = Object.keys(r.input || {}).length
        ? Object.entries(r.input).map(([k, v]) => `${k}: ${v}`).join(', ')
        : '—';
      const outputs = Object.keys(r.output || {}).length
        ? Object.entries(r.output).map(([k, v]) => `${k}: ${v}`).join(', ')
        : '—';
      const enhancement = r.enhancement_suggestion
        ? `<div class="enhancement">${escapeHtml(r.enhancement_suggestion)}</div>`
        : '';
      return `
        <div class="card">
          <div class="card-header">
            <span class="card-title">${escapeHtml(r.name)}</span>
            <span class="badge ${matchClass(r.match_type)}">${escapeHtml(r.match_type)}</span>
            <span class="score">${(r.score * 100).toFixed(0)}% match</span>
          </div>
          <p class="description">${escapeHtml(r.description)}</p>
          <div class="io"><strong>Inputs:</strong> ${escapeHtml(inputs)}</div>
          <div class="io"><strong>Outputs:</strong> ${escapeHtml(outputs)}</div>
          ${enhancement}
        </div>
      `;
    }
    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    async function search() {
      const q = (queryEl.value || '').trim();
      if (!q) return;
      clearError();
      searchBtn.disabled = true;
      resultsEl.innerHTML = '<p style="color: var(--muted);">Searching…</p>';

      try {
        const res = await fetch('/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: q }),
        });
        const data = await res.json();
        if (!res.ok) {
          showError(data.detail || res.statusText || 'Request failed');
          return;
        }
        if (!data.results || data.results.length === 0) {
          resultsEl.innerHTML = '<p style="color: var(--muted);">No results.</p>';
          return;
        }
        resultsEl.innerHTML = data.results.map(renderResult).join('');
      } catch (e) {
        showError(e.message || 'Network error');
      } finally {
        searchBtn.disabled = false;
      }
    }

    searchBtn.addEventListener('click', search);
    queryEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') search(); });
  </script>
</body>
</html>
